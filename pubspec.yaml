name: cmark_gfm_widget
version: 0.2.0
repository: https://github.com/Telosnex/cmark_gfm_widget
issue_tracker: https://github.com/Telosnex/cmark_gfm_widget/issues
description: A lightweight Flutter renderer for GitHub Flavored Markdown powered by cmark_gfm_dart.

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  cmark_gfm_dart: ^0.1.0
  # NOTE: do not add flutter_highlight here: it depends on highlight by
  # path. The one theme we used from it is vendored in
  # lib/src/theme/a11y_dark_theme.dart.
  highlight_fork: ^0.7.1
  pixel_snap_fork: ^0.1.5
  flutter_math_fork_fork: ^0.7.3
  vector_math: ^2.2.0

  cupertino_ui: ^1.1.1
  material_ui: ^1.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.3
  path: 

flutter:
